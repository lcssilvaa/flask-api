<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
</head>
<body>
    <h1>Produtos</h1>
    <a href="{{ url_for('cadastrar') }}">Cadastrar produto</a>
    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Preço de compra</th>
                <th>Preço de venda</th>
                <th>Data de criação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for produto in regs %}
            <tr>
                <td>{{ produto.descricao }}</td>
                <td>{{ produto.precocompra }}</td>
                <td>{{ produto.precovenda }}</td>
                <td>{{ produto.datacriacao }}</td>
                <td>
                    <a href="{{ url_for('editar', idproduto=produto.idproduto) }}">Editar</a>
                    <form method="post" action="{{ url_for('excluir', idproduto=produto.idproduto) }}">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="5">Nenhum produto cadastrado.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
